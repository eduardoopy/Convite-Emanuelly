<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Convite de Aniversário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="convite">
    <section class="cena" id="cena">

      <!-- Carta fica atrás do envelope e aparece quando ele abre -->
      <div class="carta" id="carta">
        <img src="carta.jpeg" alt="Carta do convite">
        <div class="conteudo">
          <!-- Você poderá colocar as informações do aniversário aqui depois -->

          









        </div>
        <nav class="atalhos" aria-label="Links do convite">
          <a class="atalho atalho-localizacao" href="https://www.google.com/maps/place/Pallace+Eventos+Espaço+de+Festa/@-16.7870926,-49.3591539,17z/data=!3m1!4b1!4m6!3m5!1s0x935ef9ba14aafd47:0x3357f24eb7966cc9!8m2!3d-16.7870926!4d-49.3591539!16s%2Fg%2F11krlhf34s?hl=pt&entry=ttu&g_ep=EgoyMDI2MDgzMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener" aria-label="Ver localização do evento">Localização</a>
          <a class="atalho atalho-whatsapp" href="https://wa.me/556291160879?text=Confirmo%20minha%20presen%C3%A7a%20na%20festa" target="_blank" rel="noopener" aria-label="Confirmar presença pelo WhatsApp">Confirmar presença</a>
          <a class="atalho atalho-presentes" href="presentes.html" aria-label="Ver sugestões de presentes">Sugestões de presentes</a>
        </nav>
        <button class="fechar" id="fechar" aria-label="Fechar convite">×</button>
      </div>

      <!-- Envelope inicial -->
      <button class="envelope" id="envelope" aria-label="Abrir convite">
        <img src="envelope.jpeg" alt="Envelope do convite">
      </button>

      <p class="instrucao" id="instrucao">Clique no envelope para abrir</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
